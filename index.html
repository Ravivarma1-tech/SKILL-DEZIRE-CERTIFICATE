
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Certificate Verification Portal</h1>
    <p>Verify your certificate details</p>
</header>

<div class="container">
    <h2>Certificate Verification</h2>

    <input type="text" id="certificateId"
           placeholder="Enter Certificate ID">

    <button onclick="verifyCertificate()">
        Verify Certificate
    </button>

    <div id="result"></div>
</div>

<footer>
    <p>Certificate Verification Portal</p>
</footer>

<script>
const certificates = {
    "1001": {
        name: "Student One",
        course: "Python Programming",
        date: "17 November 2026",
        issuer: "Your Organization"
    },
    "1002": {
        name: "Student Two",
        course: "Web Development",
        date: "17 November 2026",
        issuer: "Your Organization"
    }
};

function verifyCertificate() {
    const id = document.getElementById("certificateId").value.trim();
    const student = certificates[id];
    const result = document.getElementById("result");

    if (student) {
        result.innerHTML = `
            <h3>Certificate Found</h3>
            <p><b>Certificate ID:</b> ${id}</p>
            <p><b>Name:</b> ${student.name}</p>
            <p><b>Course:</b> ${student.course}</p>
            <p><b>Date:</b> ${student.date}</p>
            <p><b>Issuer:</b> ${student.issuer}</p>
        `;
    } else {
        result.innerHTML = "<h3>Certificate Not Found</h3>";
    }
}

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if (id) {
    document.getElementById("certificateId").value = id;
    verifyCertificate();
}
</script>

</body>
</html>
